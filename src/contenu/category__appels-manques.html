<style>
.cai .cai-pl{padding:clamp(34px,4vw,52px) 0 0}
.cai .cai-pl h1{font-size:clamp(1.9rem,3.4vw,2.5rem);max-width:24ch;margin:18px 0 16px}
.cai .cai-pl .cai-lead{max-width:60ch;margin:0}
.cai .cai-pills{display:flex;flex-wrap:wrap;gap:9px;list-style:none;padding:0;margin:clamp(26px,3vw,34px) 0 clamp(30px,3.6vw,44px)}
.cai .cai-pills li{margin:0;padding:0}
.cai .cai-pills a{display:inline-flex;font:500 .9rem/1.3 'Inter',sans-serif;color:var(--ink);background:#fff;border:1px solid #D5DFEA;border-radius:99px;padding:10px 16px;text-decoration:none;transition:border-color .16s,background .16s,color .16s}
.cai .cai-pills a:hover{border-color:#0A2540}
.cai .cai-pills a.is-on{background:#0A2540;border-color:#0A2540;color:#fff}
</style>
<div class="cai"><section class="cai-box cai-art-tete"><h1>Appels manqués</h1></section>
<style>
.cai .cai-pl{padding:clamp(34px,4vw,52px) 0 0}
.cai .cai-pl h1{font-size:clamp(1.9rem,3.4vw,2.5rem);max-width:24ch;margin:18px 0 16px}
.cai .cai-pl .cai-lead{max-width:60ch;margin:0}
</style>
<section class="cai-pl" id="cai-pl">
<span class="cai-eye">Le blog</span>
</section>
</div>

<!-- scripts de la page -->
<script>
(function(){
  if(/\/category\//.test(location.pathname)){
    var h=document.getElementById("cai-pl-h1"), l=document.getElementById("cai-pl-lead");
    if(h){h.parentNode.removeChild(h);}
    if(l){l.parentNode.removeChild(l);}
  }
})();
</script>

<script>
(function(){
  var m=location.pathname.match(/\/category\/([^\/?#]+)/);
  var slug=m?m[1]:"";
  var links=document.querySelectorAll("#cai-pl-pills a");
  for(var i=0;i<links.length;i++){
    if(links[i].getAttribute("data-s")===slug){
      links[i].className="is-on";
      links[i].setAttribute("aria-current","page");
    }
  }
})();
</script>
